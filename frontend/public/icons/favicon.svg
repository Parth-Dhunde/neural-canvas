<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeuralCanvas">
  <defs>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27231f"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <linearGradient id="nc-n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc192"/>
      <stop offset="1" stop-color="#b8743f"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#nc-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#c98d5a" stroke-opacity=".35"/>
  <!-- mesh face in perspective: the edges the N does not trace -->
  <path d="M18 15 L46 20 M18 49 L46 44" fill="none" stroke="#86c9cf" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round"/>
  <!-- the N, traced across the face -->
  <path d="M18 49 V15 L46 44 V20" fill="none" stroke="url(#nc-n)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- vertices -->
  <g fill="#f3e6cc">
    <circle cx="18" cy="15" r="2.6"/>
    <circle cx="46" cy="44" r="2.6"/>
    <circle cx="18" cy="49" r="2.1" fill-opacity=".85"/>
    <circle cx="46" cy="20" r="2.1" fill-opacity=".85"/>
  </g>
</svg>
